[project]
name = "pipeline-otimizacao-petroquimica"
version = "0.1.0"
description = "Pipeline acadêmico de machine learning, otimização e decisão de manutenção."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.30,<7",
    "markdown>=3.8,<4",
    "matplotlib>=3.10,<4",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "python-pptx>=1.0,<2",
    "reportlab>=4.2,<5",
    "scikit-learn>=1.6,<2",
    "scipy>=1.15,<2",
]

[dependency-groups]
dev = []
